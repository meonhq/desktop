# Windows 빌드: main 에 push 할 때마다 Meon 설치 프로그램(.exe)을 만든다.
# - 실행 결과 페이지의 Artifacts 에서 받을 수 있고,
# - main 빌드는 'windows-latest' 프리릴리스에도 올라가서 항상 같은 주소로 최신 설치 파일을 받을 수 있다:
#   https://github.com/meonhq/desktop/releases/download/windows-latest/meon-setup.exe
# - 같은 파일을 MEON-Installer.exe 로도 올린다. 이미 설치된 앱이 자동 업데이트로 받는 이름이라 바꾸지 않는다.
name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: ASIO SDK 받기
        run: |
          curl -sSL -o asiosdk.zip https://www.steinberg.net/asiosdk
          unzip -q asiosdk.zip -d asiotmp
          ASIODIR=$(dirname "$(dirname "$(find asiotmp -path '*common/iasiodrv.h' | head -1)")")
          mv "$ASIODIR" ../asiosdk
          ls ../asiosdk/common/iasiodrv.h

      - name: 버전
        id: ver
        run: |
          V=$(sed -n 's/^project(MEON VERSION \([0-9.]*\)).*/\1/p' CMakeLists.txt)
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: CMake 구성
        # MEON_BUILD_ID: 앱이 자동 업데이트에서 windows-latest 의 build.txt 와 비교하는 빌드 번호
        run: cmake -G "Visual Studio 17 2022" -A x64 -B build -DMEON_BUILD_ID=${{ github.run_number }}

      - name: 빌드
        run: cmake --build build --config Release --parallel --target MEON_Standalone MEON_VST3

      - name: 화면 확인용 스냅숏
        continue-on-error: true
        run: |
          mkdir -p snapshots
          EXE=build/MEON_artefacts/Release/Standalone/Meon.exe
          for s in audio settings home; do
            timeout 60 "$EXE" --nickname=테스트 --screen=$s --window=0,0,1280,800 --snapshot=snapshots/win_$s.png || true
          done
          ls -la snapshots

      - uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ github.run_number }}
          path: snapshots/*.png
          if-no-files-found: ignore

      - name: Inno Setup 설치
        run: |
          if [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then choco install innosetup -y --no-progress; fi

      - name: 설치 프로그램 만들기
        working-directory: release
        run: ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ./distwin.sh ${{ steps.ver.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: MEON-${{ steps.ver.outputs.version }}-windows-${{ github.run_number }}
          path: release/instoutput/*.exe

      - name: windows-latest 프리릴리스 갱신
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp release/instoutput/meon-*-setup.exe meon-setup.exe
          cp meon-setup.exe MEON-Installer.exe
          NOTES="main $(git rev-parse --short HEAD) 빌드 (v${{ steps.ver.outputs.version }}, run ${{ github.run_number }})"
          gh release delete windows-latest --yes --cleanup-tag || true
          gh release create windows-latest meon-setup.exe MEON-Installer.exe --prerelease --target "$GITHUB_SHA" \
            --title "Meon Windows (최신 main 빌드)" --notes "$NOTES"
          # 앱의 업데이트 확인용 빌드 번호. 설치 파일이 다 올라간 뒤에 올려야 앱이 반쯤 올라간 파일을 받지 않는다.
          echo "${{ github.run_number }}" > build.txt
          gh release upload windows-latest build.txt
