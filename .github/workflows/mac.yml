# macOS 빌드: Meon 디스크 이미지(.dmg)를 만든다. 배포(릴리스) 조건은 아래 '언제 도는가'.
# - 실행 결과 페이지의 Artifacts 에서 받을 수 있고,
# - 릴리스 빌드는 'mac-latest' 프리릴리스에도 올라가서 항상 같은 주소로 최신 파일을 받을 수 있다:
#   https://github.com/meonhq/desktop/releases/download/mac-latest/meon.dmg
# - 같은 릴리스에 앱 자동 업데이트용 MEON-mac.zip 과 build.txt(빌드 번호)도 올린다 (Source/meon/MeonUpdater.h).
#   이 둘은 이미 설치된 앱에 이름이 박혀 있으므로 바꾸지 않는다. 앱은 Meon.app 이고, zip 안의 최상위도 Meon.app 이다
#   (옛 앱은 MEON.app 을 찾지만 macOS 볼륨이 대소문자를 가리지 않아서 찾는다).
# - 유니버설(Intel + Apple Silicon) 빌드. Apple 개발자 서명·공증은 하지 않고 ad-hoc 서명만 한다.
#   처음 열 때 경고를 넘기는 방법은 doc/INSTALL.md 참고.
name: macOS build

# 언제 도는가
# - main push, PR: 빌드만 한다. 릴리스는 건드리지 않는다. 빌드 번호는 0 (로컬 빌드와 같음 → 앱의 자동 업데이트가 꺼진다)
# - 릴리스: 'v*' 태그 push, 또는 main 에서 수동 실행(workflow_dispatch). 이때만 빌드 번호(run_number)를 앱에 넣고
#   mac-latest 를 갱신한다. 다른 브랜치에서 수동 실행하면 빌드만 한다 (덜 된 브랜치가 배포되지 않게).
# - docs/** 만 바뀐 push·PR 은 건너뛴다. (태그 push 에는 경로 필터가 적용되지 않는다)
# - 이 파일 이름을 바꾸면 run_number 가 1 부터 다시 시작해 자동 업데이트가 깨진다. 바꾸지 않는다.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**']
  pull_request:
    paths-ignore: ['docs/**']
  workflow_dispatch:

# 릴리스는 한 줄로 세워서 차례로 돌리고 중간에 취소하지 않는다 (지우고 다시 만드는 도중에 끊기지 않게)
concurrency:
  group: mac-${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && 'release' || github.ref }}
  cancel-in-progress: ${{ !(startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
      # 앱에 넣는 빌드 번호. 릴리스만 run_number, 나머지는 0
      BUILD_ID: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && github.run_number || 0 }}
    steps:
      - uses: actions/checkout@v4

      - name: 버전
        id: ver
        run: |
          V=$(sed -n 's/^project(MEON VERSION \([0-9.]*\)).*/\1/p' CMakeLists.txt)
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: CMake 구성
        # MEON_BUILD_ID: 앱이 자동 업데이트에서 mac-latest 의 build.txt 와 비교하는 빌드 번호
        run: cmake -DCMAKE_BUILD_TYPE=Release -B build -DMEON_BUILD_ID=${{ env.BUILD_ID }}

      - name: 빌드
        run: cmake --build build --config Release --parallel 4 --target MEON_Standalone MEON_AU MEON_VST3

      - name: ad-hoc 서명
        # Apple Silicon 은 서명 없는 실행 파일을 아예 실행하지 않는다. 개발자 ID 가 없으니 ad-hoc 으로만 서명한다.
        # 플러그인에는 빌드 번호(MeonBuildID)를 적고, 서명한 플러그인을 앱 안 MeonPlugins.zip 에 넣은 뒤 앱을 서명한다.
        # 앱은 켤 때 사용자 폴더의 옛 플러그인을 이것으로 바꾼다 (MeonUpdater.cpp syncPlugins).
        run: |
          A=build/MEON_artefacts/Release
          for b in "$A/AU/Meon.component" "$A/VST3/Meon.vst3"; do
            plutil -replace MeonBuildID -string "${{ env.BUILD_ID }}" "$b/Contents/Info.plist"
            plutil -convert xml1 "$b/Contents/Info.plist"
            codesign --force --deep --sign - "$b"
            codesign --verify --verbose "$b"
          done
          rm -rf pluginstage && mkdir pluginstage
          cp -R "$A/AU/Meon.component" "$A/VST3/Meon.vst3" pluginstage/
          ditto -c -k pluginstage "$A/Standalone/Meon.app/Contents/Resources/MeonPlugins.zip"
          codesign --force --deep --sign - "$A/Standalone/Meon.app"
          codesign --verify --deep --verbose "$A/Standalone/Meon.app"
          lipo -info "$A/Standalone/Meon.app/Contents/MacOS/Meon"

      - name: 디스크 이미지 만들기
        run: |
          A=build/MEON_artefacts/Release
          STAGE=dmgstage
          mkdir -p "$STAGE/플러그인"
          cp -R "$A/Standalone/Meon.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          cp -R "$A/AU/Meon.component" "$A/VST3/Meon.vst3" "$STAGE/플러그인/"
          cp doc/INSTALL.md "$STAGE/설치 안내.md"
          mkdir -p dist
          hdiutil create -volname "Meon ${{ steps.ver.outputs.version }}" -srcfolder "$STAGE" \
            -fs HFS+ -format UDZO -ov "dist/meon-${{ steps.ver.outputs.version }}.dmg"
          # 자동 업데이트용: 앱만 담은 zip (ditto 는 서명과 심볼릭 링크를 그대로 보존한다)
          ditto -c -k --keepParent "$A/Standalone/Meon.app" dist/MEON-mac.zip
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: MEON-${{ steps.ver.outputs.version }}-mac-${{ github.run_number }}
          path: dist/*.dmg

      - name: mac-latest 프리릴리스 갱신
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/meon-*.dmg meon.dmg
          cp dist/MEON-mac.zip MEON-mac.zip
          NOTES="${{ github.ref_name }} $(git rev-parse --short HEAD) 빌드 (v${{ steps.ver.outputs.version }}, build ${{ env.BUILD_ID }})"
          gh release delete mac-latest --yes --cleanup-tag || true
          gh release create mac-latest meon.dmg MEON-mac.zip --prerelease --target "$GITHUB_SHA" \
            --title "Meon macOS (최신 릴리스)" --notes "$NOTES"
          # 앱의 업데이트 확인용 빌드 번호. zip 이 다 올라간 뒤에 올려야 앱이 반쯤 올라간 파일을 받지 않는다.
          echo "${{ env.BUILD_ID }}" > build.txt
          gh release upload mac-latest build.txt
