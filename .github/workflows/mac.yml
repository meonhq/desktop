# macOS 빌드: Meon 디스크 이미지(.dmg)를 만든다. 배포(릴리스) 조건은 아래 '언제 도는가'.
# - 실행 결과 페이지의 Artifacts 에서 받을 수 있고,
# - 릴리스 빌드는 'mac-latest' 프리릴리스에도 올라가서 항상 같은 주소로 최신 파일을 받을 수 있다:
#   https://github.com/meonhq/desktop/releases/download/mac-latest/meon.dmg
# - 같은 릴리스에 앱 자동 업데이트용 MEON-mac.zip 과 build.txt(빌드 번호)도 올린다 (Source/meon/MeonUpdater.h).
#   이 둘은 이미 설치된 앱에 이름이 박혀 있으므로 바꾸지 않는다. 앱은 Meon.app 이고, zip 안의 최상위도 Meon.app 이다
#   (옛 앱은 MEON.app 을 찾지만 macOS 볼륨이 대소문자를 가리지 않아서 찾는다).
# - 릴리스는 이어서 publish-dl 작업이 dl.meon.co.kr 에도 올린다 (서명한 매니페스트, 배포 설계 DISTRIBUTION_PLAN 3.6·3.9).
#   브리지 이후 앱은 dl 매니페스트를 먼저 보고, 검증된 것이 없을 때만 위의 build.txt 를 본다.
# - 유니버설(Intel + Apple Silicon) 빌드. Apple 개발자 서명·공증은 하지 않고 ad-hoc 서명만 한다.
#   처음 열 때 경고를 넘기는 방법은 doc/INSTALL.md 참고.
name: macOS build

# 언제 도는가
# - main push, PR: 빌드만 한다. 릴리스는 건드리지 않는다. 빌드 번호는 0 (로컬 빌드와 같음 → 앱의 자동 업데이트가 꺼진다)
# - 릴리스: 'v*' 태그 push, 또는 main 에서 수동 실행(workflow_dispatch). 이때만 빌드 번호를 앱에 넣고
#   mac-latest 를 갱신한 뒤 dl.meon.co.kr 에 올린다. 다른 브랜치에서 수동 실행하면 빌드만 한다 (덜 된 브랜치가 배포되지 않게).
# - 빌드 번호 = 그 커밋까지의 커밋 수 (git rev-list --count, 배포 설계 D3). 같은 커밋이면 windows.yml 과 같은 번호다.
#   이미 낸 번호보다 커야 한다 (아래 '빌드 번호' 단계가 막는다). 이 파일 이름은 바꾸지 않는다 (예전 run_number 와의 약속, CLAUDE.md).
# - docs/** 만 바뀐 push·PR 은 건너뛴다. (태그 push 에는 경로 필터가 적용되지 않는다)
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**']
  pull_request:
    paths-ignore: ['docs/**']
  workflow_dispatch:

# 릴리스는 한 줄로 세워서 차례로 돌리고 중간에 취소하지 않는다 (지우고 다시 만드는 도중에 끊기지 않게)
concurrency:
  group: mac-${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && 'release' || github.ref }}
  cancel-in-progress: ${{ !(startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}

jobs:
  build:
    # macos-26 (앱 빌드는 기본 Xcode, 최소 macOS 10.13 은 아래 단계에서 확인). macOS 26 아이콘을 만들려면 macOS 26 러너가 필요하다
    runs-on: macos-26
    permissions:
      contents: write
    outputs:
      build_id: ${{ steps.num.outputs.build_id }}
      version: ${{ steps.ver.outputs.version }}
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 릴리스는 빌드 번호(커밋 수)를 세려고 이력을 모두 받는다
          fetch-depth: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && '0' || '1' }}

      - name: 버전
        id: ver
        run: |
          V=$(sed -n 's/^project(MEON VERSION \([0-9.]*\)).*/\1/p' CMakeLists.txt)
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: 빌드 번호
        id: num
        # 릴리스: 커밋 수 (두 플랫폼 같은 번호, D3). 그 밖은 0 (로컬 빌드와 같음 → 앱의 자동 업데이트가 꺼진다).
        # 감시 (배포 설계 4.1): mac-latest 의 build.txt 보다 커야 하고, windows-latest 보다 작으면 옛 커밋이라 멈춘다.
        # desktop 은 10000 미만 (그 위는 app). dl 매니페스트 감시는 publish-dl 이 한다
        run: |
          if [ "$RELEASE" != "true" ]; then echo "build_id=0" >> "$GITHUB_OUTPUT"; echo "BUILD_ID=0" >> "$GITHUB_ENV"; exit 0; fi
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then git fetch --unshallow --quiet origin; fi
          N=$(git rev-list --count HEAD)
          read_build() { curl -fsSL --retry 3 "https://github.com/meonhq/desktop/releases/download/$1/build.txt" 2>/dev/null | tr -d '[:space:]'; }
          OWN=$(read_build mac-latest); OTHER=$(read_build windows-latest)
          case "$OWN" in ''|*[!0-9]*) echo "::warning::mac-latest 의 build.txt 를 읽지 못함"; OWN=0;; esac
          case "$OTHER" in ''|*[!0-9]*) echo "::warning::windows-latest 의 build.txt 를 읽지 못함"; OTHER=0;; esac
          echo "빌드 번호 $N (mac-latest $OWN, windows-latest $OTHER)"
          if [ "$N" -ge 10000 ]; then echo "::error::빌드 번호 $N 이 10000 이상 (desktop 범위를 넘음)"; exit 1; fi
          if [ "$N" -le "$OWN" ]; then echo "::error::빌드 번호 $N 이 mac-latest 의 $OWN 보다 크지 않음 (같은 커밋을 다시 릴리스했거나 옛 커밋)"; exit 1; fi
          if [ "$N" -lt "$OTHER" ]; then echo "::error::빌드 번호 $N 이 windows-latest 의 $OTHER 보다 작음 (옛 커밋)"; exit 1; fi
          echo "build_id=$N" >> "$GITHUB_OUTPUT"
          echo "BUILD_ID=$N" >> "$GITHUB_ENV"

      - name: CMake 구성
        # MEON_BUILD_ID: 앱이 자동 업데이트에서 매니페스트·build.txt 와 비교하는 빌드 번호
        run: cmake -DCMAKE_BUILD_TYPE=Release -B build -DMEON_BUILD_ID=${{ steps.num.outputs.build_id }}

      - name: 빌드
        run: cmake --build build --config Release --parallel 4 --target MEON_Standalone MEON_AU MEON_VST3

      - name: 전송층 테스트 (HTTP·WebSocket·TLS)
        # R11: macOS 의 HTTP(NSURLSession)와 WebSocket(IXWebSocket + mbedTLS, 키체인 루트 인증서)을 확인한다.
        # 가짜 서버(scripts/meon_test_server.py)로 상태 코드·본문·닫는 코드를, 실제 인터넷으로 인증서 검증을 본다
        if: env.RELEASE != 'true'
        run: |
          cmake --build build --config Release --parallel 4 --target MEON_Tests
          python3 scripts/meon_test_server.py 18080 2> mock.log &
          # 가짜 서버가 실제로 답할 때까지 기다린다 (러너에 따라 Python 이 뜨는 데 수십 초 걸릴 수 있다)
          for i in $(seq 1 60); do curl -s -m 2 -o /dev/null http://127.0.0.1:18080/v1/echo && break; sleep 1; done
          curl -s -m 2 -o /dev/null http://127.0.0.1:18080/v1/echo || { echo "::error::가짜 서버가 뜨지 않음"; cat mock.log; exit 1; }
          T=build/MEON_Tests_artefacts/Release/MEON_Tests
          MEON_TEST_MOCK=http://127.0.0.1:18080 "$T" Transport
          MEON_TEST_TLS=1 "$T" TransportTls
          "$T" Aoo   # AOO 소켓: 끊긴 연결에 써도 SIGPIPE 없음(E8), 거부된 연결은 실패(E9)
          "$T" Update   # 업데이트 매니페스트 검증(Ed25519·sha256)과 확인 순서를 이 플랫폼 컴파일러로 빌드한 것으로

      - name: 사이드바 폭 확인 (화면 자가 테스트)
        # 방 화면 사이드바를 창 폭 1100 / 1280 / 1440 에서 펼친 채·접은 채 들어가 본다 (--uitest=roomsidebar, 빌드 0 전용: ui/dev/UiSelfTest. 마우스 클릭 없이).
        # 1180 미만은 접힌 아이콘 줄(56), 그 이상은 사용자가 둔 상태. 독립 앱은 숨지 않는다. 결과는 "UITEST INFO room sidebar" 줄. 빌드를 막지는 않는다.
        # macOS 에는 timeout 명령이 없어 5분 뒤 직접 끝낸다
        if: env.RELEASE != 'true'
        continue-on-error: true
        run: |
          EXE=build/MEON_artefacts/Release/Standalone/Meon.app/Contents/MacOS/Meon
          for w in 1100 1280 1440; do
            "$EXE" --allow-multi --no-input --fake-script=0 --uitest=roomsidebar --window=0,0,$w,800 > "uitest-$w.log" 2>&1 &
            pid=$!
            for i in $(seq 1 300); do kill -0 $pid 2>/dev/null || break; sleep 1; done
            kill $pid 2>/dev/null || true
            grep -E "^UITEST (INFO room sidebar|FAIL|DONE)" "uitest-$w.log" || { echo "결과 없음 (폭 $w)"; tail -20 "uitest-$w.log"; }
          done

      - name: 맥 창 신호등 확인 (화면 자가 테스트)
        # 빈 툴바 + unified 스타일로 macOS 가 신호등을 52pt 윗줄 세로 가운데에 놓는지, 켤 때(온보딩)·창 크기·위치·사이드바 접기·앱 전환·
        # 더블클릭 확대·전체 화면 전후에 같은 자리인지, 맨 윗줄 누름(AppKit 이벤트)이 앱 화면으로 오는지 본다 (--uitest=chrome, 빌드 0 전용).
        # 결과는 "UITEST INFO chrome" 줄 (버튼 틀 좌표·윗줄 높이·누른 곳을 받는 뷰). 빌드를 막지는 않는다
        if: env.RELEASE != 'true'
        continue-on-error: true
        run: |
          EXE=build/MEON_artefacts/Release/Standalone/Meon.app/Contents/MacOS/Meon
          "$EXE" --allow-multi --no-input --fake-script=0 --uitest=chrome --window=0,0,1280,800 > uitest-chrome.log 2>&1 &
          pid=$!
          for i in $(seq 1 300); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null || true
          grep -E "^UITEST (INFO chrome|PASS|FAIL|DONE)" uitest-chrome.log || { echo "결과 없음"; tail -30 uitest-chrome.log; }
          # 전체 화면 단축키: 보기 메뉴, ⌃⌘F·fn+F (채팅 입력 중), 방·소리 그대로 (--uitest=fullscreen)
          "$EXE" --allow-multi --no-input --fake-script=0 --uitest=fullscreen --window=0,0,1280,800 > uitest-fullscreen.log 2>&1 &
          pid=$!
          for i in $(seq 1 180); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null || true
          echo "── fullscreen"; grep -E "^UITEST (INFO|PASS|FAIL|DONE)" uitest-fullscreen.log || { echo "결과 없음"; tail -30 uitest-fullscreen.log; }
          # 모달·확인 창 구분선 두께 (--uitest=modallines): 러너 배율 그대로, 그리고 --global-scale=2 (레티나처럼 2배로 그림)
          for gs in 1 2; do
            "$EXE" --allow-multi --no-input --fake-script=0 --uitest=modallines --global-scale=$gs --window=0,0,1024,700 > "uitest-modallines-$gs.log" 2>&1 &
            pid=$!
            for i in $(seq 1 180); do kill -0 $pid 2>/dev/null || break; sleep 1; done
            kill $pid 2>/dev/null || true
            echo "── modallines global-scale $gs"; grep -E "^UITEST (INFO modallines|FAIL|DONE)" "uitest-modallines-$gs.log" || { echo "결과 없음"; tail -30 "uitest-modallines-$gs.log"; }
          done

      - name: macOS 26 아이콘 (Icon Composer)
        # images/icons/AppIcon.icon 을 Xcode 26 의 actool 로 Assets.car 로 만들어 앱에 넣고 CFBundleIconName 을 적는다.
        # macOS 26 은 이것을 쓰고(예전 .icns 만 있으면 회색 틀에 가둘 수 있다), 그 아래 버전은 지금처럼 Icon.icns 를 쓴다.
        # 못 만들면 빌드를 실패시킨다 (.icns 만 든 앱이 조용히 나가지 않게). actool 은 실패해도 0 으로 끝날 수 있어 결과 파일로 확인한다
        run: |
          APP=build/MEON_artefacts/Release/Standalone/Meon.app
          # Xcode 26 의 아이콘 렌더러(AssetCatalogAgent)는 macOS 26 의 시스템 기능을 쓴다.
          # macOS 15 러너에서는 대부분 죽고 가끔만 됐다(빌드마다 결과가 달라졌다). 그래서 macOS 26 러너가 필요하다
          HOST=$(sw_vers -productVersion | cut -d. -f1)
          if [ "$HOST" -lt 26 ]; then echo "::error::러너가 macOS $HOST 입니다. macOS 26 아이콘은 macOS 26 이상 러너에서만 만들 수 있습니다"; exit 1; fi
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo "::error::Xcode 26 이 없어 macOS 26 아이콘을 만들 수 없습니다"; exit 1; fi
          echo "actool: $XC"
          # DEVELOPER_DIR 로 actool 만 빌리면 기본 Xcode 의 프레임워크와 섞여 AssetCatalogAgent 가 죽을 수 있다.
          # 아이콘을 만드는 동안만 Xcode 26 을 통째로 고르고, 끝나면 원래 Xcode 로 되돌린다
          PREV=$(xcode-select -p)
          trap 'sudo xcode-select -s "$PREV"' EXIT
          sudo xcode-select -s "$XC/Contents/Developer"
          # 일시적인 실패에 대비해 3번까지 시도한다. 결과 파일이 있고, Assets.car 안에 AppIcon 이 들어 있어야 성공
          ok=0
          for try in 1 2 3; do
            rm -rf iconout && mkdir iconout
            if xcrun actool images/icons/AppIcon.icon --compile iconout \
                 --platform macosx --minimum-deployment-target 10.13 --app-icon AppIcon \
                 --output-partial-info-plist iconout/partial.plist --warnings --errors --notices > iconout/actool.log 2>&1 \
               && [ -s iconout/Assets.car ] && [ -s iconout/AppIcon.icns ] \
               && xcrun assetutil --info iconout/Assets.car 2>/dev/null | grep -q '"Name" : "AppIcon"'; then
              ok=1; echo "actool 성공 ($try 번째)"; break
            fi
            echo "actool 실패 ($try 번째):"; cat iconout/actool.log
            sleep 5
          done
          ls -la iconout
          if [ "$ok" != 1 ]; then echo "::error::macOS 26 아이콘(Assets.car)을 만들지 못했습니다"; exit 1; fi
          cp iconout/Assets.car "$APP/Contents/Resources/Assets.car"
          plutil -replace CFBundleIconName -string AppIcon "$APP/Contents/Info.plist"
          plutil -p "$APP/Contents/Info.plist" | grep -i icon

      - name: ad-hoc 서명
        # Apple Silicon 은 서명 없는 실행 파일을 아예 실행하지 않는다. 개발자 ID 가 없으니 ad-hoc 으로만 서명한다.
        # 플러그인에는 빌드 번호(MeonBuildID)를 적고, 서명한 플러그인을 앱 안 MeonPlugins.zip 에 넣은 뒤 앱을 서명한다.
        # 앱은 켤 때 사용자 폴더의 옛 플러그인을 이것으로 바꾼다 (MeonUpdater.cpp syncPlugins).
        run: |
          A=build/MEON_artefacts/Release
          for b in "$A/AU/Meon.component" "$A/VST3/Meon.vst3"; do
            plutil -replace MeonBuildID -string "${{ steps.num.outputs.build_id }}" "$b/Contents/Info.plist"
            plutil -convert xml1 "$b/Contents/Info.plist"
            codesign --force --deep --sign - "$b"
            codesign --verify --verbose "$b"
          done
          rm -rf pluginstage && mkdir pluginstage
          cp -R "$A/AU/Meon.component" "$A/VST3/Meon.vst3" pluginstage/
          ditto -c -k pluginstage "$A/Standalone/Meon.app/Contents/Resources/MeonPlugins.zip"
          codesign --force --deep --sign - "$A/Standalone/Meon.app"
          codesign --verify --deep --verbose "$A/Standalone/Meon.app"
          lipo -info "$A/Standalone/Meon.app/Contents/MacOS/Meon"

      - name: 최소 macOS 버전 확인
        # CMakeLists.txt 의 CMAKE_OSX_DEPLOYMENT_TARGET(10.13) 이 러너·Xcode 와 관계없이 지켜졌는지 본다.
        # Intel 은 10.13, Apple Silicon 은 OS 가 11.0 부터라 11.0 으로 나온다
        run: |
          A=build/MEON_artefacts/Release
          for b in "$A/Standalone/Meon.app/Contents/MacOS/Meon" "$A/AU/Meon.component/Contents/MacOS/Meon" "$A/VST3/Meon.vst3/Contents/MacOS/Meon"; do
            # 10.13 처럼 낮으면 LC_VERSION_MIN_MACOSX 의 "version", 아니면 LC_BUILD_VERSION 의 "minos" 에 적힌다
            X=$(vtool -arch x86_64 -show-build "$b" | awk '$1=="minos"||$1=="version"{print $2; exit}')
            R=$(vtool -arch arm64 -show-build "$b" | awk '$1=="minos"||$1=="version"{print $2; exit}')
            echo "$b: x86_64 minos $X, arm64 minos $R"
            if [ "$X" != "10.13" ]; then echo "::error::$b 의 최소 macOS 버전이 $X 입니다 (10.13 이어야 함)"; exit 1; fi
          done

      - name: 디스크 이미지 만들기
        run: |
          A=build/MEON_artefacts/Release
          STAGE=dmgstage
          mkdir -p "$STAGE/플러그인"
          cp -R "$A/Standalone/Meon.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          cp -R "$A/AU/Meon.component" "$A/VST3/Meon.vst3" "$STAGE/플러그인/"
          cp doc/INSTALL.md "$STAGE/설치 안내.md"
          # 디스크 이미지를 열었을 때 보이는 볼륨 아이콘 (앱 아이콘과 같은 것)
          cp images/icons/MEON.icns "$STAGE/.VolumeIcon.icns"
          mkdir -p dist
          VOL="Meon ${{ steps.ver.outputs.version }}"
          hdiutil create -volname "$VOL" -srcfolder "$STAGE" -fs HFS+ -format UDRW -ov dist/rw.dmg
          MNT=$(hdiutil attach -readwrite -noverify -noautoopen dist/rw.dmg | grep -o '/Volumes/.*' | head -1)
          # 볼륨에 '사용자 아이콘 있음' 표시를 켜야 Finder 가 .VolumeIcon.icns 를 쓴다
          xcrun SetFile -a C "$MNT" || echo "::warning::볼륨 아이콘 표시를 켜지 못했습니다"
          hdiutil detach "$MNT"
          hdiutil convert dist/rw.dmg -format UDZO -ov -o "dist/meon-${{ steps.ver.outputs.version }}.dmg"
          rm -f dist/rw.dmg
          # 자동 업데이트용: 앱만 담은 zip (ditto 는 서명과 심볼릭 링크를 그대로 보존한다)
          ditto -c -k --keepParent "$A/Standalone/Meon.app" dist/MEON-mac.zip
          ls -la dist

      # dmg 와 자동 업데이트용 zip. 릴리스면 publish-dl 작업이 이것을 받아 dl 에 올린다
      - uses: actions/upload-artifact@v4
        with:
          name: MEON-${{ steps.ver.outputs.version }}-mac-${{ github.run_number }}
          path: |
            dist/*.dmg
            dist/MEON-mac.zip

      - name: mac-latest 프리릴리스 갱신
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/meon-*.dmg meon.dmg
          cp dist/MEON-mac.zip MEON-mac.zip
          NOTES="${{ github.ref_name }} $(git rev-parse --short HEAD) 빌드 (v${{ steps.ver.outputs.version }}, build ${{ steps.num.outputs.build_id }})"
          gh release delete mac-latest --yes --cleanup-tag || true
          gh release create mac-latest meon.dmg MEON-mac.zip --prerelease --target "$GITHUB_SHA" \
            --title "Meon macOS (최신 릴리스)" --notes "$NOTES"
          # 앱의 업데이트 확인용 빌드 번호. zip 이 다 올라간 뒤에 올려야 앱이 반쯤 올라간 파일을 받지 않는다.
          echo "${{ steps.num.outputs.build_id }}" > build.txt
          gh release upload mac-latest build.txt

  publish-dl:
    # dl.meon.co.kr 에 올린다 (배포 설계 3.6·3.9, scripts/dl_publish.sh): 빌드 파일 → CDN 으로 sha256 확인 → release.json → 채널 매니페스트 마지막.
    # 릴리스일 때만, 빌드 작업(GitHub 릴리스, build.txt 마지막)이 끝난 뒤. 비밀값은 이 작업만 받는다 (Environment dl-release: main·v* 태그만).
    # 서명한 매니페스트는 올리기 전에 앱과 같은 코드·같은 키 헤더(MEON_ManifestTool)로 검증한다.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    environment: dl-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: 패키지 설치
        # 검증 도구는 JUCE(juce_core) 로 빌드한다. 프로젝트 구성에 linux.yml 과 같은 패키지가 필요하다
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev libjack-jackd2-dev libopus-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libxcomposite-dev \
            libgl1-mesa-dev libcurl4-openssl-dev

      - name: 검증 도구 빌드 (앱과 같은 확인 코드·키 헤더)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMEON_BUILD_ID=0 -DMEON_TESTS=OFF
          cmake --build build --target MEON_ManifestTool
          echo "TOOL=$PWD/build/MEON_ManifestTool_artefacts/Release/MEON_ManifestTool" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: MEON-${{ needs.build.outputs.version }}-mac-${{ github.run_number }}
          path: artifacts

      - name: dl.meon.co.kr 에 올리기
        env:
          BUILD_ID: ${{ needs.build.outputs.build_id }}
          VERSION: ${{ needs.build.outputs.version }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          SIGNING_KEY: ${{ secrets.DL_SIGNING_KEY_GPL1 }}
        run: bash scripts/dl_publish.sh mac artifacts
