# Linux 확인용 빌드: 배포하지 않는다. 리메이크 작업에서 PR 마다 세 가지를 확인한다.
# - 독립 앱이 컴파일되는지 (macOS·Windows 와 같은 화면 코드)
# - 단위 테스트(MEON_Tests)가 통과하는지
# - 가상 화면(Xvfb)에서 찍은 화면 스냅숏 (Artifacts 의 linux-snapshots-*)
# 릴리스·자동 업데이트와 관계없다. 빌드 번호는 항상 0 (개발용 실행 옵션이 켜진다).
name: Linux check

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  pull_request:
    paths-ignore: ['docs/**']
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 패키지 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev libjack-jackd2-dev libopus-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libxcomposite-dev \
            libgl1-mesa-dev libcurl4-openssl-dev \
            xvfb xauth

      - name: CMake 구성
        # RelWithDebInfo: 링크 시간 최적화(LTO) 없이 빨리 빌드한다
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DMEON_BUILD_ID=0

      - name: 빌드
        run: cmake --build build --parallel --target MEON_Tests MEON_Standalone

      - name: 단위 테스트
        # 전송층 테스트(Transport)는 가짜 HTTP·WebSocket 서버(scripts/meon_test_server.py)에 붙는다
        run: |
          python3 scripts/meon_test_server.py 18080 2> mock.log &
          # 가짜 서버가 실제로 답할 때까지 기다린다 (러너에 따라 Python 이 뜨는 데 수십 초 걸릴 수 있다)
          for i in $(seq 1 60); do curl -s -m 2 -o /dev/null http://127.0.0.1:18080/v1/echo && break; sleep 1; done
          curl -s -m 2 -o /dev/null http://127.0.0.1:18080/v1/echo || { echo "::error::가짜 서버가 뜨지 않음"; cat mock.log; exit 1; }
          MEON_TEST_MOCK=http://127.0.0.1:18080 build/MEON_Tests_artefacts/RelWithDebInfo/MEON_Tests

      - name: 화면 자가 테스트
        # 실제 창(Xvfb)에 마우스·키를 넣어 합주 화면 흐름을 확인한다 (--uitest, 빌드 0 전용: ui/dev/UiSelfTest).
        # 4 방 나가기 · 5 최소화 · 6 패널 너비 · 7 채팅 입력 · AOO 끊김(이름을 찾을 수 없는 AOO 서버: 끊김 표시, 빠르게 나갔다 들어가기)
        # SIGPIPE 는 무시하지 않는다: 엔진이 닫힌 TCP 연결에 쓰다 SIGPIPE 가 나면 앱이 끝나 실패한다 (REMAKE_PLAN E8)
        # 독립 앱 1280×800 과 플러그인 900×600 을 따로 돈다. 실패가 하나라도 있으면 종료 코드가 0 이 아니다.
        # --fake-script=0: 가짜 서버의 각본 사용자를 끈다 (친구가 시간에 따라 방을 옮기면 '참여' 버튼이 있을 때도 없을 때도 있다)
        run: |
          APP=build/MEON_artefacts/RelWithDebInfo/Standalone/meon
          status=0
          for mode in app plugin; do
            export HOME="$RUNNER_TEMP/uitest-$mode"
            mkdir -p "$HOME"
            if [ "$mode" = plugin ]; then args="--as-plugin --window=0,0,900,600"; else args="--window=0,0,1280,800"; fi
            code=0
            timeout 600 xvfb-run -a -s "-screen 0 1600x1000x24" "$APP" --allow-multi --no-input --fake-script=0 --uitest=all $args > "uitest-$mode.log" 2>&1 || code=$?
            grep "^UITEST" "uitest-$mode.log" || true
            if [ $code -ne 0 ] || ! grep -q "^UITEST DONE .* 0 failed" "uitest-$mode.log"; then
              echo "::error::화면 자가 테스트 실패 ($mode, 종료 코드 $code)"
              status=1
            fi
          done
          exit $status

      - name: 화면 스냅숏
        continue-on-error: true
        run: |
          mkdir -p snapshots
          APP=build/MEON_artefacts/RelWithDebInfo/Standalone/meon
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          for size in 1280x800 900x600; do
            W=${size%x*}; H=${size#*x}
            for s in login signup verify nickname part discord done home home:create home:filter home:code home:notif home:fail home:toast home:toastline home:ping home:fold=friends:0.5 home:sendoff home:homemon home:friendreq home:profile home:profilereq home:disc home:discinvite home:discback home:discbackinvite home:roomlost home:roomlostinvite jam jam:host jam:headerarm jam:mini jam:minihost jam:miniarm jam:miniconfirm jam:minicreate jam:wide jam:chatwide jam:input jam:input=scroll jam:input=962 jam:input=over jam:sendoff jam:disc jam:discback jam:ping jam:chat jam:links jam:fold=chat:0.5 jam:fold=send:0.5 settings:account settings:audio settings:jam settings:privacy settings:about widgets; do
              # 연결 끊김 토스트: discback 은 4초 끊겼다 다시 붙은 뒤 "다시 연결됐어요" 가 떠 있는 동안, invite 는 초대 토스트가 4초 먼저
              D=3000; case "$s" in home:toast|home:toastline) D=6000;; esac
              case "$s" in home:discback|jam:discback) D=9500;; jam:ping) D=6000;; home:discbackinvite) D=13500;; home:discinvite) D=8000;; home:roomlostinvite) D=7000;; jam:miniarm) D=3300;; jam*|settings*|home:disc) D=5000;; esac
              # jam:miniarm: 나가기 확인 상태는 3초 뒤 풀리므로 그 전에 찍는다 (jam:headerarm 은 3.5초에 누른다)
              timeout 60 xvfb-run -a -s "-screen 0 1600x1000x24" \
                "$APP" --nickname=테스트 --screen=$s --window=0,0,$W,$H --no-input --snapshot-delay=$D \
                --snapshot="$PWD/snapshots/linux_${s//:/_}_${size}.png" || true
            done
          done
          # 플러그인 화면 (독립 앱에서 --as-plugin, 900×600)
          for s in home jam jam:disc jam:ping jam:chat jam:minihost jam:miniarm jam:wide jam:chatwide jam:input jam:headerarm settings:jam; do
            D=5000; [ "$s" = jam:miniarm ] && D=3300
            timeout 60 xvfb-run -a -s "-screen 0 1600x1000x24" \
              "$APP" --as-plugin --screen=$s --window=0,0,900,600 --no-input --snapshot-delay=$D \
              --snapshot="$PWD/snapshots/linux_plugin_${s//:/_}_900x600.png" || true
          done
          ls -la snapshots

      - uses: actions/upload-artifact@v4
        with:
          name: linux-snapshots-${{ github.run_number }}
          path: snapshots/*.png
          if-no-files-found: warn
