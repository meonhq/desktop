# 시험용 (본 빌드 아님): macos-26 러너를 쓸 수 있는지, 거기서 Xcode 26 actool 이 macOS 26 아이콘(Assets.car)을
# 매번 제대로 만드는지, 앱 빌드와 최소 macOS 버전(10.13) 확인이 그대로 통과하는지 본다. 배포·릴리스는 하지 않는다.
# 시험이 끝나면 이 파일은 지운다 (mac.yml 의 run_number 와는 관계없다).
#
# 언제 도는가: 이 파일을 시험 브랜치에서 바꿔 push 할 때와, 그 실행을 다시 돌릴(re-run) 때만.
# (workflow_dispatch 는 파일이 기본 브랜치 main 에 있어야 수동 실행 버튼이 생겨서 쓸 수 없다)
name: macOS 26 runner test

on:
  push:
    branches: [claude/vigilant-dijkstra-p3fjna]
    paths: ['.github/workflows/mac26-test.yml']

concurrency:
  group: mac26-test
  cancel-in-progress: false

jobs:
  mac26:
    name: macos-26
    runs-on: macos-26
    # 러너를 잡은 뒤 걸리는 시간 제한. 러너를 기다리는 시간은 아래 watchdog 이 끊는다
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 러너 정보
        run: |
          sw_vers
          uname -m
          xcode-select -p
          xcodebuild -version
          ls -d /Applications/Xcode*.app

      - name: macOS 26 아이콘 (actool 3번, 다시 시도 없이)
        # mac.yml 과 같은 명령. 한 번이라도 실패하면 이 시험은 실패다
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo "::error::Xcode 26 이 없습니다"; exit 1; fi
          echo "actool: $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          fails=0
          for try in 1 2 3; do
            rm -rf "iconout$try" && mkdir "iconout$try"
            if xcrun actool images/icons/AppIcon.icon --compile "iconout$try" \
                 --platform macosx --minimum-deployment-target 10.13 --app-icon AppIcon \
                 --output-partial-info-plist "iconout$try/partial.plist" --warnings --errors --notices > "iconout$try/actool.log" 2>&1 \
               && [ -s "iconout$try/Assets.car" ] && [ -s "iconout$try/AppIcon.icns" ]; then
              echo "== $try 번째 성공"
            else
              fails=$((fails + 1))
              echo "::error::$try 번째 실패"
              cat "iconout$try/actool.log"
            fi
            ls -la "iconout$try"
            shasum -a 256 "iconout$try"/Assets.car "iconout$try"/AppIcon.icns 2>/dev/null || true
          done
          if [ "$fails" != 0 ]; then exit 1; fi
          cat iconout1/partial.plist
          # Assets.car 안에 AppIcon 이 들어갔는지 (이름·크기 목록)
          (xcrun assetutil --info iconout1/Assets.car || assetutil --info iconout1/Assets.car) > iconout1/assetutil.json
          grep -E '"(Name|RenditionName|AssetType|PixelWidth|PixelHeight|Idiom|Appearance)"' iconout1/assetutil.json | sort | uniq -c
          grep -q 'AppIcon' iconout1/assetutil.json || { echo "::error::Assets.car 에 AppIcon 이 없습니다"; exit 1; }

      - name: CMake 구성
        # 앱 빌드는 이 러너의 기본 Xcode 로 한다 (mac.yml 과 같은 조건)
        run: |
          sudo xcode-select -r
          xcodebuild -version
          cmake -DCMAKE_BUILD_TYPE=Release -B build -DMEON_BUILD_ID=0

      - name: 빌드
        run: cmake --build build --config Release --parallel 4 --target MEON_Standalone MEON_AU MEON_VST3

      - name: 아이콘 넣기·서명
        run: |
          A=build/MEON_artefacts/Release
          APP="$A/Standalone/Meon.app"
          cp iconout1/Assets.car "$APP/Contents/Resources/Assets.car"
          plutil -replace CFBundleIconName -string AppIcon "$APP/Contents/Info.plist"
          plutil -p "$APP/Contents/Info.plist" | grep -i icon
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --verbose "$APP"
          lipo -info "$APP/Contents/MacOS/Meon"

      - name: 최소 macOS 버전 확인
        # mac.yml 과 같은 확인
        run: |
          A=build/MEON_artefacts/Release
          for b in "$A/Standalone/Meon.app/Contents/MacOS/Meon" "$A/AU/Meon.component/Contents/MacOS/Meon" "$A/VST3/Meon.vst3/Contents/MacOS/Meon"; do
            X=$(vtool -arch x86_64 -show-build "$b" | awk '$1=="minos"||$1=="version"{print $2; exit}')
            R=$(vtool -arch arm64 -show-build "$b" | awk '$1=="minos"||$1=="version"{print $2; exit}')
            echo "$b: x86_64 minos $X, arm64 minos $R"
            if [ "$X" != "10.13" ]; then echo "::error::$b 의 최소 macOS 버전이 $X 입니다 (10.13 이어야 함)"; exit 1; fi
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac26-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: iconout*/
          if-no-files-found: ignore

  # macos-26 러너가 30분 안에 잡히지 않으면 실행을 취소한다 (없는 라벨은 하루 가까이 대기열에 남는다)
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: 러너 대기 감시
        run: |
          for i in $(seq 1 30); do
            S=$(gh api "repos/$GH_REPO/actions/runs/${{ github.run_id }}/jobs" --jq '.jobs[] | select(.name=="macos-26") | .status')
            echo "$(date -u +%H:%M:%S) macos-26: $S"
            if [ "$S" = "in_progress" ] || [ "$S" = "completed" ]; then echo "러너가 잡혔습니다"; exit 0; fi
            sleep 60
          done
          echo "::error::macos-26 러너가 30분 안에 잡히지 않아 실행을 취소합니다"
          gh run cancel "${{ github.run_id }}" || gh api -X POST "repos/$GH_REPO/actions/runs/${{ github.run_id }}/force-cancel"
          exit 1
